<title>Global Building · Modelos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: full-height app — 3D stage on the left, spec panel on the right; stacks on phones */
:root{
  --bg:#ECEEEF; --surface:#FFFFFF; --fg:#1A1E22; --muted:#5B656E; --line:#D3D9DD;
  --accent:#E0531D; --accent-soft:#FBE4DA; --chip:#F3F5F6; --scene:#E3E7EA; --ground:#CDD3D7;
  --overlay:rgba(255,255,255,.88); --logo-bg:transparent; --logo-pad:0;
  --f-display:"Chakra Petch", "Bahnschrift", "Arial Narrow", sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111417; --surface:#181C20; --fg:#E7EAEC; --muted:#99A3AB; --line:#2B3137;
  --accent:#F26A33; --accent-soft:#3A2219; --chip:#20252A; --scene:#191D21; --ground:#24292E;
  --overlay:rgba(24,28,32,.9); --logo-bg:#FFFFFF; --logo-pad:5px 9px; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111417; --surface:#181C20; --fg:#E7EAEC; --muted:#99A3AB; --line:#2B3137;
  --accent:#F26A33; --accent-soft:#3A2219; --chip:#20252A; --scene:#191D21; --ground:#24292E;
  --overlay:rgba(24,28,32,.9); --logo-bg:#FFFFFF; --logo-pad:5px 9px; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.shell{display:flex;flex-direction:column;height:100%;padding-inline:16px;padding-block:12px 16px;gap:12px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1;margin:0;letter-spacing:.01em}
.brand h1 span{color:var(--accent)}
.brand p{margin:0;color:var(--muted);font-size:14px}
.maker{height:54px;width:auto;align-self:center;background:var(--logo-bg);border-radius:8px;padding:var(--logo-pad)}
.brand .sep{align-self:stretch;width:1px;background:var(--line)}
.plan-wrap{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.plan-wrap img{display:block;width:100%;cursor:zoom-in}
.plan-keys{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:13.5px}
.plan-keys li{display:grid;grid-template-columns:96px 1fr;gap:10px}
.plan-keys b{font-family:var(--f-display);font-weight:600;font-variant-numeric:tabular-nums}
.variant{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}

.app{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px}
.stage{position:relative;min-height:0;border-radius:14px;overflow:hidden;background:var(--scene);border:1px solid var(--line)}
#c{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}

.modes{position:absolute;top:12px;left:12px;display:flex;gap:4px;padding:4px;background:var(--overlay);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(6px);flex-wrap:wrap;max-width:calc(100% - 24px)}
.modes button{border:0;background:transparent;padding:7px 12px;border-radius:7px;font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.03em;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--accent);color:#fff}
.toggles{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 24px)}
.toggles label{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--overlay);border:1px solid var(--line);border-radius:999px;font-size:13px;cursor:pointer;backdrop-filter:blur(6px)}
.toggles input{accent-color:var(--accent);margin:0}
.hint{position:absolute;top:62px;left:12px;font-size:12.5px;color:var(--muted);background:var(--overlay);padding:4px 10px;border-radius:6px;max-width:calc(100% - 24px)}

.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.spot{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:6px;transform:translate(-50%,-100%);border:0;background:var(--surface);color:var(--fg);border-radius:999px;padding:4px 10px 4px 6px;font-size:12.5px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.18);cursor:pointer;white-space:nowrap}
.spot i{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.spot.on{background:var(--accent);color:#fff}
.dim{position:absolute;left:0;top:0;transform:translate(-50%,-50%);font-family:var(--f-display);font-weight:600;font-size:13px;color:var(--accent);background:var(--surface);padding:1px 7px;border-radius:4px;border:1px solid var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.dim.soft{border-style:dashed}

.card{position:absolute;right:12px;bottom:12px;width:min(320px,calc(100% - 24px));background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.card h3{margin:0 0 4px;font-family:var(--f-display);font-size:19px}
.card p{margin:0 0 8px;font-size:14px;color:var(--muted)}
.card .row{display:flex;gap:8px;flex-wrap:wrap}
.card .x{position:absolute;top:8px;right:8px;border:0;background:transparent;font-size:18px;cursor:pointer;color:var(--muted);line-height:1;padding:4px}
.btn{border:1px solid var(--line);background:var(--chip);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}

.pad{position:absolute;right:12px;bottom:12px;display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,46px);gap:4px}
.pad button{border:1px solid var(--line);background:var(--overlay);border-radius:10px;font-size:18px;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.pad .up{grid-column:2;grid-row:1}.pad .lt{grid-column:1;grid-row:2}.pad .dn{grid-column:2;grid-row:2}.pad .rt{grid-column:3;grid-row:2}

.panel{min-height:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:transparent;padding:12px 8px;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.03em;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.pane{overflow:auto;padding:16px;min-height:0;flex:1}
.eyebrow{font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.eyebrow:first-child{margin-top:0}
.hero-num{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.hero-num div{background:var(--surface);padding:10px 8px;text-align:center}
.hero-num b{display:block;font-family:var(--f-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.hero-num small{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.08em}
dl.spec{margin:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:0}
dl.spec dt,dl.spec dd{padding:8px 0;border-bottom:1px solid var(--line);margin:0;font-size:14px}
dl.spec dt{color:var(--muted);padding-right:12px}
dl.spec dd{text-align:right;font-weight:500;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px}
.note{font-size:12.5px;color:var(--muted);margin:14px 0 0;line-height:1.45}
ul.mats{margin:0;padding:0;list-style:none;display:grid;gap:6px}
ul.mats li{display:grid;grid-template-columns:110px 1fr;gap:10px;font-size:13.5px}
ul.mats b{font-family:var(--f-display);color:var(--accent);font-weight:600}
.rooms{display:grid;gap:8px}
.room{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer}
.room:hover,.room.on{border-color:var(--accent)}
.room b{font-family:var(--f-display);font-size:16px}
.room span{display:block;font-size:13px;color:var(--muted)}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gallery figure{margin:0}
.gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;display:block;cursor:zoom-in}
.gallery figure.wide{grid-column:1 / -1}
.gallery figure.wide img{aspect-ratio:16/10}
.gallery figcaption{font-size:12px;color:var(--muted);padding-top:3px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:24px;z-index:20;cursor:zoom-out}
.lightbox img{max-height:100%;max-width:100%;border-radius:8px;background:#fff}

.models{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.models button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 14px;text-align:left;cursor:pointer;display:grid;line-height:1.25}
.models b{font-family:var(--f-display);font-size:15px;font-weight:600}
.models small{font-size:12px;color:var(--muted)}
.models button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.models button[aria-pressed="true"] b{color:var(--accent)}
.vchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;font-variant-numeric:tabular-nums}
.vchip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.plan-fig{margin:0 0 12px}
.plan-fig figcaption{font-size:12px;color:var(--muted);padding-top:4px}

@media (max-width: 860px){
  html,body{height:auto}
  .shell{height:auto}
  .app{grid-template-columns:1fr}
  .stage{height:68svh;min-height:420px}
  .panel{max-height:none}
  .pane{overflow:visible}
  .brand h1{font-size:28px}
  .maker{height:36px}
  .hint{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
